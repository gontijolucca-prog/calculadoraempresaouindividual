<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada · Estudo 360</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { --accent: #0677FF; --ink: #0B1D2D; --muted: #64748B; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: "Montserrat", "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 70% -10%, #E8F1FF 0%, #F5F7FA 45%, #EEF2F7 100%);
        color: var(--ink); padding: 24px;
      }
      main { max-width: 520px; text-align: center; }
      .marca { font-weight: 900; letter-spacing: 3px; font-size: 12px; color: var(--muted); text-transform: uppercase; }
      h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 800; letter-spacing: -1px; margin: 14px 0 10px; }
      p { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0 0 22px; }
      a {
        display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
        font-weight: 800; font-size: 14px; padding: 12px 22px; border-radius: 12px;
      }
      a:hover { filter: brightness(0.94); }
      .codigo { font-size: 12px; color: #94A3B8; margin-top: 18px; }
    </style>
  </head>
  <body>
    <main>
      <div class="marca">Estudo 360</div>
      <h1>Esta página não existe</h1>
      <p>O endereço pode estar incompleto ou o ficheiro já não existe. Volte à entrada da aplicação.</p>
      <a href="/">Ir para o Estudo 360</a>
      <div class="codigo">Erro 404</div>
    </main>
  </body>
</html>
